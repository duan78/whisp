[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisp-assistant"
version = "2.1.0"
description = "Un assistant vocal personnel intelligent et multilingue"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Whisp Assistant Team", email = "contact@whisp-assistant.com"}
]
maintainers = [
    {name = "Whisp Assistant Team", email = "contact@whisp-assistant.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
keywords = [
    "assistant",
    "voice assistant",
    "speech recognition",
    "text-to-speech",
    "automation",
    "natural language",
    "ai",
    "python",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyautogui>=0.9.54",
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "gTTS>=2.5.0",
    "edge-tts>=6.1.0",
    "pygame>=2.5.0",
    "TTS>=0.22.0",
    "piper-tts>=1.2.0",
    "pyperclip>=1.8.0",
    "pywin32>=228; platform_system=='Windows'",
    "mouse>=0.7.1; platform_system=='Windows'",
    "pyobjc>=7.3; platform_system=='Darwin'",
    "python-xlib>=0.31; platform_system=='Linux'",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "werkzeug>=3.0.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "mistralai>=1.9.0",
    "openai>=1.0.0",
    "pytesseract>=0.3.13",
    "vosk>=0.3.45",
    "faster-whisper>=1.0.3",
    "keyboard>=0.13.5",
    "psutil>=5.9.0",
    "plyer>=2.1.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.9.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]
optimization = [
    "numba>=0.59.0",  # Optimisation JIT (fallback automatique si absent)
]
gpu = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.35.0",
    "openai-whisper>=20231117",
]

[project.urls]
Homepage = "https://github.com/duan78/whisp"
Repository = "https://github.com/duan78/whisp.git"
"Bug Tracker" = "https://github.com/duan78/whisp/issues"
Changelog = "https://github.com/duan78/whisp/blob/master/CHANGELOG.md"

[project.scripts]
whisp-assistant = "main:assistant_vocal"

# Le code vit à plat à la racine (main.py, config.py, ...) + dans les
# packages core/, web/, window/ et stt/. La liste des py-modules doit être
# exhaustive : une installation pip avec une liste partielle produisait un
# whisp-assistant qui plantait au premier import manquant.
# Limitation connue : templates/ et static/ (données racine) ne sont
# embarquées que dans le sdist via MANIFEST.in — l'app est conçue pour être
# lancée depuis le dépôt.
[tool.setuptools]
py-modules = [
    "accessibility_commands", "analysis_commands", "api_security",
    "audio_optimization", "base_command_module", "browser_commands",
    "bug_tracker", "cache_manager", "command_aliases", "command_optimization",
    "command_processor", "config", "cuda_path_fixer", "database_commands",
    "database_manager", "dev_environment_commands", "dictation_mode",
    "error_handler", "exit_commands", "file_commands", "git_commands",
    "input_validation", "install_ffmpeg", "install_vosk_model",
    "keyboard_commands", "lazy_loader", "logger_config", "main",
    "math_optimization", "mouse_commands", "os_detection",
    "platform_audio_config", "platform_utils", "productivity_commands",
    "project_management_commands", "reminder_commands", "screen_context",
    "screen_reader", "screen_reader_commands", "search_commands",
    "set_mistral_api_key", "shortcuts_database", "speech_recognition_module",
    "stt_engine_factory", "system_commands", "text_processing", "tts_module",
    "universal_audio_backend", "vosk_sounddevice_stt", "web_dev_commands",
    "web_interface", "window_manager",
]
packages = ["core", "web", "window", "stt"]
include-package-data = true

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["main", "core", "config", "web_interface"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
# Note: la couverture est désactivée par défaut. Pour l'activer :
#   pytest --cov=. --cov-report=term-missing
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration (requires pytest-cov)
# To enable coverage reporting: pip install pytest-cov
# Then uncomment the lines below:
# addopts = [
#     "--cov=.",
#     "--cov-report=term-missing",
#     "--cov-report=html",
#     "--cov-report=xml",
# ]

[tool.coverage.run]
# Mesure la couverture sur tout le code à la racine + core/ (le projet n'est
# pas un package unique). À utiliser avec : pytest --cov=.
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.*",
    "setup.py",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]